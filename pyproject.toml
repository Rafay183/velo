[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "velo-ui"
version = "0.1.0"
description = "Beautiful, reactive Python web apps in minutes. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Rafay Shaikh" }]
keywords = ["web", "ui", "dashboard", "streamlit alternative", "gradio alternative", "data apps"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rafay183/velo"
Issues = "https://github.com/rafay183/velo/issues"
Changelog = "https://github.com/rafay183/velo/blob/main/CHANGELOG.md"

[project.scripts]
velo = "velo.cli:main"

[tool.setuptools]
packages = ["velo"]

[tool.setuptools.package-data]
velo = ["static/*"]
