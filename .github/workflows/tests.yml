name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e .
      - name: Run tests
        run: |
          python tests/test_velo.py
          python tests/test_studio.py
      - name: CLI smoke test
        run: |
          velo version
          velo new smoke_app
          velo export --help
          python -c "import velo, velo.templates as T, velo.spec as S; [S.write_spec(n + '.velo.json', T.get(n)) for n in T.TEMPLATES]"
          velo export dashboard.velo.json -o dashboard_app.py
          python -c "import runpy, velo.server as s; s.SUPPRESS_RUN = True; runpy.run_path('dashboard_app.py')"
